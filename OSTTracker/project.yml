name: OSTTracker
options:
  bundleIdPrefix: com.brajanzalta
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    from: 0.4.9
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
targets:
  OSTTracker:
    type: application
    platform: macOS
    info:
      path: MacInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.brajanzalta.osttracker
            CFBundleURLSchemes:
              - osttracker
    sources:
      - Sources
      - Assets.xcassets
      - path: Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.brajanzalta.OSTTracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_ATSApplicationFontsPath: "Fonts"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
    postBuildScripts:
      - name: Embed Python runtime
        script: "\"${SRCROOT}/../packaging/04_copy_runtime.sh\""
        basedOnDependencyAnalysis: false
      - name: Install to /Applications
        script: "\"${SRCROOT}/../packaging/07_install_to_applications.sh\""
        basedOnDependencyAnalysis: false
  OSTTrackerIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: IOSInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.brajanzalta.osttracker
            CFBundleURLSchemes:
              - osttracker
        NSLocalNetworkUsageDescription: "Connect to OSTTracker on your Mac to share your competition data."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: Sources
        excludes:
          - Sidecar/EmbeddedSidecar.swift
          - Sidecar/python_shim.c
      - Assets.xcassets
      - path: Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreText.framework
      - sdk: UIKit.framework
      - package: Supabase
        product: Supabase
      - package: YouTubeKit
        product: YouTubeKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.brajanzalta.OSTTracker.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ATSApplicationFontsPath: "Fonts"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.2"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ARCHS: arm64
  OSTTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: OSTTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.brajanzalta.OSTTrackerTests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  OSTTracker:
    build:
      targets:
        OSTTracker: all
    test:
      targets:
        - OSTTrackerTests
  OSTTrackerIOS:
    build:
      targets:
        OSTTrackerIOS: all
