name: release

# Tag-triggered multi-platform release: builds the macOS app (universal),
# the WinUI 3 client (x64 + arm64), the GTK4 client (x64 + arm64), and the
# iOS app, then drafts a GitHub Release with all artifacts + checksums.
#
# Runner notes (verify against current GitHub labels when first running):
#   macos-14 runs on Apple Silicon (arm64); a universal macOS build needs a
#   Developer ID + notarization secrets (CODESIGN_IDENTITY / notary creds).
#   windows-11-arm is the public ARM64 Windows runner; ubuntu-24.04-arm is
#   the public ARM64 Linux runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash packaging/01_fetch_runtime.sh
      - run: bash packaging/02_install_deps.sh
      - run: cd OSTTracker && xcodegen generate
      - name: Build universal Release
        run: |
          cd OSTTracker
          xcodebuild -project OSTTracker.xcodeproj -scheme OSTTracker \
            -configuration Release -derivedDataPath build \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build -quiet
      - name: Package dmg
        run: |
          APP=OSTTracker/build/Build/Products/Release/OSTTracker.app
          bash packaging/05_codesign.sh "$APP"
          mkdir -p out
          hdiutil create -volname OSTTracker -srcfolder "$APP" \
            -ov -format UDZO out/OSTTracker-macOS-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) { throw "NSIS install did not provide makensis.exe" }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        shell: pwsh
        run: ./clients/windows/packaging/build.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            clients/windows/out/OstTracker-windows-${{ matrix.arch }}.zip
            clients/windows/out/OSTTracker-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: ./clients/linux/packaging/build.sh ${{ matrix.arch }} --appimage --deb
      - name: Tar bundle
        run: tar -czf OSTTracker-linux-${{ matrix.arch }}.tar.gz -C clients/linux/out/app-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            OSTTracker-linux-${{ matrix.arch }}.tar.gz
            clients/linux/out/OSTTracker-linux-${{ matrix.arch }}.AppImage
            clients/linux/out/OSTTracker-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  ios:
    name: iOS (TestFlight ipa)
    runs-on: macos-26
    # Needs the Apple Developer secret; without it the job fails but must not
    # block the desktop release from drafting.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build + export ipa
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: bash packaging/08_ios_build.sh --archive
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: packaging/runtime/export/*.ipa
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [macos, windows, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd _artifacts
          # artifacts may carry nested directories; flatten and checksum files
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -mindepth 1 -type d -empty -delete
          cat > INSTALL.txt <<'EOF'
          OST Tracker installation

          Linux Debian/Ubuntu: Install the matching .deb with `sudo apt install ./OSTTracker-linux-*.deb`.
          Apt installs GTK4 and GStreamer automatically. Other distributions can use the
          AppImage after installing the GTK4/GStreamer packages for their distro; it prints
          the Debian/Ubuntu package command when those libraries are missing. The .tar.gz
          contains the same portable app bundle.

          macOS: Open the universal DMG and drag OSTTracker.app to Applications.

          Windows: Run the setup.exe matching your CPU (x64 or arm64). The ZIP is a
          portable alternative; extract it and run OSTTracker.exe.

          iOS: An IPA is included only when the Apple signing job succeeds. It is a
          TestFlight distribution build and is not a direct App Store installation.
          EOF
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: _artifacts/**
